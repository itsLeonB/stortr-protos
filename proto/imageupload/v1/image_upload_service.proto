syntax = "proto3";

package imageupload.v1;

import "google/protobuf/empty.proto";
import "imageupload/v1/image_upload_message.proto";

option go_package = "github.com/itsLeonB/stortr-protos/gen/go/imageupload/v1;imageupload";

service ImageUploadService {
  rpc UploadStream(stream UploadStreamRequest) returns (UploadStreamResponse);
  rpc GetUrl(GetUrlRequest) returns (GetUrlResponse);
  rpc Delete(DeleteRequest) returns (google.protobuf.Empty);
}

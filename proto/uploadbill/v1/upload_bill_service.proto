syntax = "proto3";

package uploadbill.v1;

import "google/protobuf/empty.proto";
import "uploadbill/v1/upload_bill_message.proto";

option go_package = "github.com/itsLeonB/stortr-protos/gen/go/uploadbill/v1;uploadbill";

service UploadBillService {
  rpc UploadStream(stream UploadStreamRequest) returns (UploadStreamResponse);
  rpc GetUrl(GetUrlRequest) returns (GetUrlResponse);
  rpc Delete(DeleteRequest) returns (google.protobuf.Empty);
}
